name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm build
        env:
          # placeholder so index.html's %VITE_API_BASE_URL% preconnect resolves; the CI bundle is discarded
          VITE_API_BASE_URL: http://localhost:3001

      - run: pnpm test

      - run: pnpm audit --prod
        continue-on-error: true

  schema-drift:
    runs-on: ubuntu-latest
    # postgres:17 matches the live major version; the runner's own pg_dump (16) can't dump a 17 server
    container: postgres:17
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5

      - run: scripts/check-schema-drift.sh
