name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm build
        env:
          # placeholder so Base.astro's VITE_API_BASE_URL preconnect has a value; the CI bundle is discarded
          VITE_API_BASE_URL: http://localhost:3001

      - run: pnpm test

      - run: pnpm audit --prod
        continue-on-error: true

  schema-drift:
    runs-on: ubuntu-latest
    # Exact tag: pg_dump output shifts between minors, so bump it together with the snapshot.
    # Major 17 matches live; the runner's own pg_dump (16) can't dump a 17 server.
    container: postgres:17.11
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5

      - run: scripts/check-schema-drift.sh

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_CLI_VERSION: 2.121.0
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # The image set is fixed by the CLI version, so it keys the cache. Avoids anonymous-pull
      # rate limits on public.ecr.aws.
      - uses: actions/cache/restore@v6
        id: images
        with:
          path: /tmp/supabase-images.tar
          key: supabase-images-${{ env.SUPABASE_CLI_VERSION }}

      - if: steps.images.outputs.cache-hit == 'true'
        run: docker load -i /tmp/supabase-images.tar

      - run: scripts/test-integration.sh

      # Populating the cache must never fail a run whose tests passed.
      - if: steps.images.outputs.cache-hit != 'true'
        continue-on-error: true
        # the CLI falls back from public.ecr.aws to ghcr.io when ECR rate-limits the runner
        run: docker save -o /tmp/supabase-images.tar $(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '^(public\.ecr\.aws|ghcr\.io)/supabase/')

      - if: steps.images.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: /tmp/supabase-images.tar
          key: supabase-images-${{ env.SUPABASE_CLI_VERSION }}

  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter frontend exec playwright install --with-deps chromium

      # Every story as a test in headless Chromium, including its axe accessibility check.
      - run: pnpm --filter frontend test:storybook
        env:
          # lib/api.ts builds /api/v1 URLs from this. Unset, they'd start with /undefined/ and
          # slip past the preview's unmocked-request check, which matches paths starting /api/.
          VITE_API_BASE_URL: http://localhost:3001
